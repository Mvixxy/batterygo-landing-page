<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#132B52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative battery shapes -->
  <rect x="50" y="30" width="80" height="180" rx="10" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.1"/>
  <rect x="65" y="20" width="50" height="10" rx="4" fill="#F59E0B" opacity="0.1"/>
  <rect x="55" y="80" width="70" height="100" rx="5" fill="#F59E0B" opacity="0.1"/>

  <rect x="1070" y="420" width="80" height="180" rx="10" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.1"/>
  <rect x="1085" y="410" width="50" height="10" rx="4" fill="#F59E0B" opacity="0.1"/>
  <rect x="1075" y="470" width="70" height="100" rx="5" fill="#F59E0B" opacity="0.1"/>

  <!-- Battery icon -->
  <rect x="100" y="220" width="100" height="140" rx="12" stroke="#F59E0B" stroke-width="3" fill="none"/>
  <rect x="125" y="205" width="50" height="15" rx="5" fill="#F59E0B"/>
  <rect x="112" y="280" width="76" height="60" rx="6" fill="#F59E0B"/>

  <!-- Title -->
  <text x="250" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="72" font-weight="800">BatteryGo</text>

  <!-- Subtitle -->
  <text x="250" y="320" fill="#F59E0B" font-family="Arial, sans-serif" font-size="32" font-weight="600">Toko Aki 24 Jam - Bogor</text>

  <!-- Tagline -->
  <text x="250" y="365" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" opacity="0.7">Aki Mobil &amp; Motor | GS Astra, Incoe, Yuasa, Marathon</text>

  <!-- Bottom bar -->
  <rect y="540" width="1200" height="90" fill="#F59E0B" opacity="0.15"/>

  <!-- URL -->
  <text x="600" y="595" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" opacity="0.8">www.gantiaki24jam.web.id</text>

  <!-- Phone -->
  <text x="600" y="620" fill="#F59E0B" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" opacity="0.6">+62 823-2100-6968</text>
</svg>
